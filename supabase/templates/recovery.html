<div style="font-family:Arial,Helvetica,sans-serif;max-width:520px;margin:0 auto;color:#1c2b26">
  <h2 style="color:#14523f">Reset your password</h2>
  <p>We received a request to reset your Abiye password. The link is valid for one hour.</p>
  <p><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/account/reset-password"
        style="display:inline-block;background:#14523f;color:#fff;padding:12px 20px;border-radius:8px;text-decoration:none">Choose a new password</a></p>
  <hr style="border:none;border-top:1px solid #e5e5e5;margin:24px 0">
  <h2 style="color:#14523f">የይለፍ ቃል ይቀይሩ</h2>
  <p><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/account/reset-password">አዲስ የይለፍ ቃል ይምረጡ</a></p>
  <p style="color:#777;font-size:12px">If you did not ask for this, ignore this email — your password stays the same. / ይህን ካልጠየቁ ኢሜይሉን ችላ ይበሉ።</p>
</div>
